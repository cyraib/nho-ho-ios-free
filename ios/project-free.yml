name: NhoHoFree
options:
  bundleIdPrefix: vn.nhoho
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    NHOHO_APP_ORIGIN: ""
targets:
  NhoHo:
    type: application
    platform: iOS
    sources:
      - path: NhoHo
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.nhoho.personal
        PRODUCT_NAME: NhoHo
        CODE_SIGN_ENTITLEMENTS: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FREE_PERSONAL_BUILD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nhớ Hộ
        INFOPLIST_KEY_NhoHoDefaultOrigin: $(NHOHO_APP_ORIGIN)
        INFOPLIST_KEY_NSCameraUsageDescription: Chụp ảnh cho nhật ký của bạn.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Chọn ảnh cho nhật ký của bạn.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  NhoHo:
    build:
      targets:
        NhoHo: all
    run:
      config: Debug
    archive:
      config: Release
